name: GUNFALL build

# Сборка готовых билдов (Windows / Linux) и выгрузка их как артефактов.
# Запускается вручную (workflow_dispatch) или по тегу вида v1.0.0 — экспорт
# тяжёлый (скачивает ~1.2 ГБ шаблонов), поэтому не на каждый push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, напр. v0.1.0 (пусто — только артефакты, без релиза)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write   # нужно для создания релиза и загрузки бинарников

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.6.3"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}

      - name: Set up Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          curl -sL -o /tmp/tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -o -q /tmp/tpl.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path godot --import 2>&1 | tail -3 || true

      - name: Export builds
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build/linux build/windows
          "$GODOT" --headless --path godot --export-release "Linux"   "$PWD/build/linux/gunfall.x86_64"
          "$GODOT" --headless --path godot --export-release "Windows" "$PWD/build/windows/gunfall.exe"
          test -s build/linux/gunfall.x86_64
          test -s build/windows/gunfall.exe

      - uses: actions/upload-artifact@v4
        with:
          name: gunfall-linux
          path: build/linux/
      - uses: actions/upload-artifact@v4
        with:
          name: gunfall-windows
          path: build/windows/

      # Релиз: по тегу vX.Y.Z или по ручному запуску с указанной версией
      - name: Package release archives
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        run: |
          cd build
          (cd windows && zip -q ../gunfall-windows.zip gunfall.exe)
          (cd linux && zip -q ../gunfall-linux.zip gunfall.x86_64)
          ls -la

      - name: Create GitHub Release with builds
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
          name: "GUNFALL ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}"
          files: |
            build/gunfall-windows.zip
            build/gunfall-linux.zip
