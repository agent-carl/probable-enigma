name: GUNFALL tests

on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read   # тестам достаточно чтения

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.6.3"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sL -o /tmp/godot.zip "$url"
          unzip -o -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path godot --import 2>&1 | tail -5 || true

      - name: Parse-check scripts
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path godot --check-only --script res://Game.gd
          "$GODOT" --headless --path godot --check-only --script res://Test.gd

      - name: Run headless test suite
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          out=$("$GODOT" --headless --path godot --script res://Test.gd 2>&1)
          echo "$out"
          echo "$out" | grep -q "ALL TESTS PASSED"

  # Визуальная проверка: демо-бот играет под Xvfb (софтовый GL) и снимает PNG
  # ключевых экранов; кадры выкладываются артефактом "demo-screenshots".
  screenshots:
    runs-on: ubuntu-latest
    needs: headless-tests
    env:
      GODOT_VERSION: "4.6.3"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sL -o /tmp/godot.zip "$url"
          unzip -o -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Import project
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path godot --import 2>&1 | tail -5 || true

      - name: Render demo screenshots
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p shots
          for scene in dead fx chest elite; do
            rm -f /tmp/gunfall_demo_*.png
            # демо само завершится после кадра 240; падение на выходе не критично
            xvfb-run -a -s "-screen 0 1280x720x24" \
              "$GODOT" --path godot --rendering-driver opengl3 --demo "--$scene" \
              > /dev/null 2>&1 || true
            for f in /tmp/gunfall_demo_*.png; do
              [ -e "$f" ] || continue
              cp "$f" "shots/${scene}_$(basename "$f" .png | sed 's/gunfall_demo_//').png"
            done
          done
          ls -la shots
          [ -n "$(ls shots)" ]   # хотя бы один кадр обязан отрендериться

      - name: Log preview thumbnails
        # уменьшенные base64-превью в лог: их можно смотреть через API логов,
        # когда скачивание zip-артефакта недоступно (полный размер — в артефакте)
        run: |
          command -v convert > /dev/null || sudo apt-get install -y -qq imagemagick
          for f in $(ls shots/*.png | head -6); do
            convert "$f" -resize 420x -quality 55 /tmp/prev.jpg
            echo "=== PREVIEW $(basename "$f") ==="
            base64 -w0 /tmp/prev.jpg
            echo
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: shots/
          retention-days: 14
