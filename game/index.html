<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GUNFALL — платформер-рогалик: процедурные уровни, огнестрельное оружие, улучшения между уровнями.">
  <meta name="theme-color" content="#0d1020">
  <title>GUNFALL — платформер-рогалик</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div class="overlay" id="menuOv">
      <h1 class="title">GUNFALL</h1>
      <p class="tag">Платформер-рогалик: каждый забег — новая карта</p>
      <div class="controls">
        <div><b>A / D</b> или <b>← / →</b> — бег</div>
        <div><b>W / ↑ / Пробел</b> — прыжок · <b>S + прыжок</b> — спрыгнуть с платформы</div>
        <div><b>Мышь</b> — прицел · <b>ЛКМ</b> — огонь</div>
        <div><b>1–4 / колесо</b> — оружие · <b>Esc</b> — пауза · <b>M</b> — звук</div>
      </div>
      <div class="seed-row">
        <input id="seedInput" placeholder="Сид (пусто — случайный)" maxlength="24" autocomplete="off" spellcheck="false">
        <button class="btn" id="playBtn">Играть</button>
      </div>
      <p class="best" id="bestLine"></p>
    </div>

    <div class="overlay hidden" id="upgradeOv">
      <h2>Уровень пройден!</h2>
      <p class="sub">Выберите улучшение:</p>
      <div class="cards" id="cards"></div>
    </div>

    <div class="overlay hidden" id="deadOv">
      <h2 class="dead-title">Вы погибли</h2>
      <div class="stats" id="deadStats"></div>
      <button class="btn" id="retryBtn">Новый забег</button>
      <button class="btn ghost" id="menuBtn">В меню</button>
    </div>

    <div class="overlay hidden" id="pauseOv">
      <h2>Пауза</h2>
      <button class="btn" id="resumeBtn">Продолжить</button>
      <button class="btn ghost" id="quitBtn">Выйти в меню</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
